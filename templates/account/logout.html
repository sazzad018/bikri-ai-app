{% extends 'account/base.html' %}

{% block content %}
<div class="w-full max-w-xs">
    <div class="flex flex-col items-center gap-2 mb-8">
        <h2 class="text-xl font-semibold">Logout ?</h2>
        <p class="text-sm text-gray-500">Are you sure you want to logout?</p>
    </div>
    <form x-data="{loading: false}" @submit="loading = true" action="{% url 'account_logout' %}" method="post" class="flex flex-col gap-4">
        {% csrf_token %}
        <div class="flex gap-3 w-full">
            <button class="flex-1 btn" href="{% url 'account_login' %}">Cancel</button>
            <button class="flex-1 btn-primary" type="submit">Logout</button>
        </div>
    </form>
</div>
{% endblock %}
