<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Page Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <div class="flex items-center justify-center h-screen font-mono">
        <div class="flex flex-col sm:flex-row items-center gap-24">
            <div class="flex flex-col gap-1">
                <h1 class="text-xl text-gray-900">ERROR: 404</h1>
                <p class="text-base text-gray-700">{{ exception|default:"The requested url was not found" }}</p>
            </div>
        </div>
    </div>
    
</body>
</html>
